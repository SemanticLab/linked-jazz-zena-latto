name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deploy finish; queue only the newest run behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Publish only what the pages load. Source photographs (images/) and the
      # build scripts (scripts/) stay in the repository but are not served.
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html assets data restoration transcript _site/
          # semlab.io sits behind Cloudflare, which caches CSS and JS for four hours.
          # Stamp the commit into those URLs so every deploy is fetched fresh.
          sed -i -E "s#(assets/site\.css|assets/site\.js|data/latto\.js)\"#\1?v=${GITHUB_SHA::8}\"#g" _site/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
